<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>AI Resume Analyzer</b><span><a href="#resume">Resume</a><a href="#jobs">Jobs</a><a href="#career">Career Advisor</a><button id="logout">Logout</button></span></nav><main class="container"><section id="resume" class="card"><h2>Upload Resume</h2><input type="file" id="file" accept=".pdf,.docx"><button class="btn" id="upload">Analyze Resume</button><p id="uploadMsg"></p></section><section id="resumeResult" class="card hidden"></section><section id="jobs" class="card"><h2>Jobs</h2><div class="grid"><input id="search" placeholder="Search title, skill, location"><button class="btn" id="searchBtn">Search</button></div><div id="jobsList"></div></section><section id="career" class="card"><h2>Career Advisor (RAG)</h2><textarea id="question" rows="4" placeholder="Ask a career question..."></textarea><button class="btn" id="ask">Ask AI</button><div id="answer"></div></section></main><script src="/js/app.js"></script><script src="/js/dashboard.js"></script></body></html>
