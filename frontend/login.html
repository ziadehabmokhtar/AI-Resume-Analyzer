<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth"><form class="card" id="form"><h1>Login</h1><label>Email<input type="email" id="email" required></label><label>Password<input type="password" id="password" required></label><button class="btn">Login</button><p id="msg"></p><p>No account? <a href="/register.html">Register</a></p></form></main><script src="/js/app.js"></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});if(r.access_token){localStorage.token=r.access_token;location='/dashboard.html'}else msg.textContent=r.detail||'Login failed'};</script></body></html>
