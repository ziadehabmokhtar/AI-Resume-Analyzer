<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth"><form class="card" id="form"><h1>Create account</h1><label>Email<input type="email" id="email" required></label><label>Password (8+ chars)<input type="password" id="password" minlength="8" required></label><button class="btn">Register</button><p id="msg"></p><p>Already registered? <a href="/login.html">Login</a></p></form></main><script src="/js/app.js"></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await api('/api/auth/register',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});if(r.access_token){localStorage.token=r.access_token;location='/dashboard.html'}else msg.textContent=r.detail||'Registration failed'};</script></body></html>
